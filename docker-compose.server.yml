services:
  radar-api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=claude-sonnet-4-6
      - SIMILARITY_THRESHOLD=0.85
      - HISTORY_DB_PATH=data/history.db
    volumes:
      - radar_data:/app/data

  radar-dashboard:
    build: ./dashboard
    restart: always
    ports:
      - "8502:8501"
    environment:
      - HISTORY_DB_PATH=data/history.db
    volumes:
      - radar_data:/app/data

volumes:
  radar_data:
